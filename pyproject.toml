[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiroptmap"
version = "0.1.1"
description = "Checkpoint-free Gaussian and ORCA transition-moment-density maps for chiroptical analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Yuuya Nagata" },
  { name = "Takashi Hirose" }
]
keywords = [
  "circularly polarized luminescence",
  "Gaussian",
  "ORCA",
  "TD-DFT",
  "transition moment density",
  "electric dipole transition moment",
  "magnetic dipole transition moment"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "numpy>=1.23"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/yuuyanagata/ChiroptMap"
Repository = "https://github.com/yuuyanagata/ChiroptMap"
Issues = "https://github.com/yuuyanagata/ChiroptMap/issues"

[project.scripts]
chiroptmap = "chiroptmap.cli:main"
chiroptmap-gaussian-wfx = "chiroptmap.wfx_cubes:main"
chiroptmap-orca = "chiroptmap.orca_json_cubes:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chiroptmap*"]
