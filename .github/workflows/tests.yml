name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Python 3.9 binaries are available on 24.04, but not on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check installed analysis commands outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          chiroptmap-state-fields --help
          chiroptmap-analytic --help
          chiroptmap-maps --help
          chiroptmap-check-convergence --help
